# 从 Google Play 同步最新签名通用 APK 到 GitHub Releases
#
# 对外固定下载链接（永远指向最新版）：
#   https://github.com/PuHuaKuang/browsehere-play-apk/releases/latest/download/app-release.apk
#
# Secrets：
#   PLAY_SERVICE_ACCOUNT_JSON  - Google Play 服务账号 JSON 密钥全文（必需）
# Variables：
#   PLAY_SIGNING_CERT_SHA256   - Play Console「应用完整性」中的应用签名证书 SHA-256 指纹
#                                （可选；配置后校验签名指纹，不符即拒绝发布）
#
# 校验链（任一失败即中止，旧 Release 保持不变）：
#   1. 完整性   - aapt 能解析包结构
#   2. 正式包   - 包名必须等于 com.tcl.browser
#   3. 官方签名 - apksigner 验签通过，且证书指纹与 Play App Signing 一致
#   4. 防回退   - versionCode 不得小于当前线上版本

name: Sync Play Signed Universal APK

on:
  schedule:
    - cron: "0 2 * * *"   # 每天 UTC 02:00（北京时间 10:00）
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPECT_PACKAGE: com.tcl.browser

jobs:
  sync-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby & fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - run: gem install fastlane --no-document

      - name: 安装校验工具（aapt / apksigner）
        run: sudo apt-get update -qq && sudo apt-get install -y aapt apksigner

      - name: 下载当前线上旧 APK（用于指纹与版本对比）
        id: before
        run: |
          gh release download latest-apk -p app-release.apk -O app-release-old.apk --clobber 2>/dev/null || true
          if [ -f app-release-old.apk ]; then
            echo "old_sha=$(sha256sum app-release-old.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          else
            echo "old_sha=none" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 从 Google Play 下载最新签名通用 APK
        run: fastlane android download_latest_universal_apk
        env:
          PACKAGE_NAME: ${{ secrets.PACKAGE_NAME || 'com.tcl.browser' }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

      - name: 校验 APK（完整性 / 包名 / 签名 / 版本）
        id: verify
        run: |
          set -e

          echo "=== 1. 完整性校验（aapt 解析） ==="
          BADGING=$(aapt dump badging app-release.apk) || { echo "::error::APK 结构损坏，aapt 无法解析"; exit 1; }
          PKG=$(echo "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          VC=$(echo "$BADGING"  | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p")
          VN=$(echo "$BADGING"  | sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p")
          echo "包名=$PKG  versionCode=$VC  versionName=$VN"
          [ -n "$VC" ] || { echo "::error::无法解析 versionCode"; exit 1; }

          echo "=== 2. 正式包校验（包名） ==="
          if [ "$PKG" != "$EXPECT_PACKAGE" ]; then
            echo "::error::包名不符！期望 $EXPECT_PACKAGE，实际 $PKG"; exit 1;
          fi

          echo "=== 3. 签名校验（apksigner 验签 + 证书指纹） ==="
          apksigner verify app-release.apk || { echo "::error::apksigner 验签失败"; exit 1; }
          CERT=$(apksigner verify --print-certs app-release.apk | sed -n "s/Signer #1 certificate SHA-256 digest: //p")
          echo "签名证书 SHA-256: $CERT"
          EXPECT_CERT="${{ vars.PLAY_SIGNING_CERT_SHA256 }}"
          if [ -n "$EXPECT_CERT" ]; then
            if [ "$CERT" != "$EXPECT_CERT" ]; then
              echo "::error::签名证书指纹不符，非正式包！期望 $EXPECT_CERT，实际 $CERT"; exit 1;
            fi
            echo "证书指纹匹配 Play App Signing ✓"
          else
            echo "::warning::未配置 PLAY_SIGNING_CERT_SHA256，跳过证书指纹比对（建议配置）"
          fi

          echo "=== 4. 版本对比（防回退 + 变更检测） ==="
          NEW_SHA=$(sha256sum app-release.apk | cut -d' ' -f1)
          CHANGED=true
          if [ -f app-release-old.apk ]; then
            OLD_VC=$(aapt dump badging app-release-old.apk | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p")
            echo "线上 versionCode=$OLD_VC -> 新版 versionCode=$VC"
            if [ -n "$OLD_VC" ] && [ "$VC" -lt "$OLD_VC" ]; then
              echo "::error::版本回退！线上 $OLD_VC，新版 $VC，拒绝发布"; exit 1;
            fi
            if [ "$NEW_SHA" = "${{ steps.before.outputs.old_sha }}" ]; then
              CHANGED=false
              echo "APK 指纹与线上一致，无新版本，跳过 Release 更新"
            fi
          fi

          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "new_sha=$NEW_SHA"   >> "$GITHUB_OUTPUT"
          echo "changed=$CHANGED"   >> "$GITHUB_OUTPUT"

      - name: 更新 latest-apk Release（覆盖上传，链接不变）
        if: steps.verify.outputs.changed == 'true'
        run: |
          gh release delete latest-apk --yes --cleanup-tag=false 2>/dev/null || true
          gh release create latest-apk app-release.apk \
            --title "Latest APK - v${{ steps.verify.outputs.version_name }} (${{ steps.verify.outputs.version_code }})" \
            --notes "自动同步自 Google Play 生产版本（已通过完整性/包名/签名/版本校验）
          versionCode: ${{ steps.verify.outputs.version_code }}
          SHA256: ${{ steps.verify.outputs.new_sha }}
          同步时间: $(date -u '+%Y-%m-%d %H:%M UTC')

          固定下载地址：releases/latest/download/app-release.apk"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
